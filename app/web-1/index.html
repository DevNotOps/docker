<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101522">
    <title>Local Time — Clock</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f5f7ff;
        background:
          radial-gradient(ellipse at 18% 20%, rgb(91 85 190 / 24%), transparent 38%),
          radial-gradient(ellipse at 82% 78%, rgb(32 147 162 / 16%), transparent 36%),
          #101522;
      }

      main {
        width: min(100% - 40px, 760px);
        padding: clamp(36px, 8vw, 76px) clamp(24px, 7vw, 64px);
        text-align: center;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 28px;
        background: linear-gradient(145deg, rgb(255 255 255 / 7%), rgb(255 255 255 / 2%));
        box-shadow: 0 32px 90px rgb(0 0 0 / 28%), inset 0 1px rgb(255 255 255 / 8%);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 30px;
        color: #aeb8d0;
        font-size: 0.75rem;
        font-weight: 650;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #71e3c1;
        box-shadow: 0 0 14px rgb(113 227 193 / 75%);
      }

      .clock {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: clamp(5px, 1.5vw, 14px);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .digits {
        font-size: clamp(4rem, 14vw, 8.5rem);
        font-weight: 300;
        letter-spacing: -0.085em;
        line-height: 1;
      }

      .separator {
        color: #75809d;
        font-size: clamp(3.5rem, 12vw, 7rem);
        font-weight: 200;
        line-height: 1;
        animation: pulse 2s ease-in-out infinite;
      }

      .period {
        margin-left: 6px;
        color: #aeb8d0;
        font-size: clamp(1rem, 3vw, 1.5rem);
        font-weight: 500;
        letter-spacing: 0;
      }

      .date {
        margin: 24px 0 0;
        color: #d3d9e8;
        font-size: clamp(1rem, 3vw, 1.25rem);
        font-weight: 400;
      }

      .timezone {
        margin: 12px 0 0;
        color: #8994ae;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
      }

      @keyframes pulse {
        50% { opacity: 0.45; }
      }

      @media (max-width: 420px) {
        main {
          width: min(100% - 24px, 760px);
          padding-inline: 16px;
          border-radius: 22px;
        }

        .clock {
          gap: 3px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span>Your local time</p>
      <time class="clock" id="clock" aria-label="Current local time">
        <span class="digits" id="hours">--</span>
        <span class="separator" aria-hidden="true">:</span>
        <span class="digits" id="minutes">--</span>
        <span class="separator" aria-hidden="true">:</span>
        <span class="digits" id="seconds">--</span>
        <span class="period" id="period"></span>
      </time>
      <p class="date" id="date"></p>
      <p class="timezone" id="timezone"></p>
    </main>

    <script>
      const timeFormatter = new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
      const dateFormatter = new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      function updateClock() {
        const now = new Date();
        const parts = Object.fromEntries(
          timeFormatter.formatToParts(now).map(({ type, value }) => [type, value])
        );

        document.getElementById("hours").textContent = parts.hour;
        document.getElementById("minutes").textContent = parts.minute;
        document.getElementById("seconds").textContent = parts.second;
        document.getElementById("period").textContent = parts.dayPeriod ?? "";
        document.getElementById("date").textContent = dateFormatter.format(now);
        document.getElementById("timezone").textContent =
          Intl.DateTimeFormat().resolvedOptions().timeZone.replaceAll("_", " ");
        document.getElementById("clock").dateTime = now.toISOString();
      }

      updateClock();
      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
