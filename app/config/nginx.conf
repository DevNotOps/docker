events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;


    server {
        listen 80;
        server_name _;

        location = /command {
            return 301 /command/;
        }

        location ^~ /command/ {
            rewrite ^/command/(.*)$ /$1 break;
            proxy_pass http://command:80;
        }

        location / {
            proxy_pass http://time:80;
        }
    }
}