services:
  nginx:
    image: nginx
    container_name: nginx
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - time
      - command
    ports:
      - "5000:80"

  time:
    image: nginx
    container_name: time
    volumes:
      - ./web-1/index.html:/usr/share/nginx/html/index.html:ro

  command:
    image: nginx
    container_name: command
    volumes:
      - ./web-2/index.html:/usr/share/nginx/html/index.html:ro